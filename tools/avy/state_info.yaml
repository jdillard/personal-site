# Avalanche Canada areas (not avalanche.org zones, so never looked up by a map-layer
# state); always built, so there is no `active` flag
- abbr: "CAN"
  name: "Canada"
  # Avalanche Canada defines bands by terrain, not elevation, and publishes no numbers.
  # Areas are regrouped from subregions daily, so bands are keyed by the `mountain_range`
  # (or `polygon_name`, which wins) in tools/avy/data/canadian_subregions.geojson. An
  # area uses the bands more than half of its subregions map to, else the default.
  #
  # DERIVED, NOT PUBLISHED: rough treeline by range from general knowledge, rounded to
  # 100 ft. Spot-checked against treeline/alpine elevations in the 2023-24 to 2025-26
  # forecast archives (https://api.avalanche.ca/forecasts/en/products?date=<ISO datetime>,
  # every 2 days); only 14 usable mentions, which agree with these bands for the
  # Central Rockies (treeline 2200-2300 m), South Coast (1740-1800 m), Purcells (1900 m)
  # and North Rockies (alpine above 2000 m). No data for the Cariboos, Monashees,
  # Selkirks, South Rockies or East Coast.
  # TODO: replace with Avalanche Canada's numbers if they share them
  elevations:
    # fallback for mixed-range areas (e.g. early-season all-of-BC); Columbia
    # Mountains values, roughly mid-range between the Coast and Rockies
    0: # default
      btl: [0, 5600]
      ntl: [5601, 6900]
      atl: [6901, 20310]
    # ~1500 / 1900 m
    "South Coast":
      btl: [0, 4900]
      ntl: [4901, 6200]
      atl: [6201, 20310]
    # ~1300 / 1700 m; raised from 1000 / 1400 m after Terrace-area forecasts (2026):
    # "at treeline around 1600 m", "Below treeline: ... crust up to roughly 1500 m".
    # Stewart / Haines Pass likely sit lower.
    "North Coast":
      btl: [0, 4300]
      ntl: [4301, 5600]
      atl: [5601, 20310]
    # ~1500 / 2000 m
    "Cariboos":
      btl: [0, 4900]
      ntl: [4901, 6600]
      atl: [6601, 20310]
    # ~1500 / 2000 m
    "Monashees":
      btl: [0, 4900]
      ntl: [4901, 6600]
      atl: [6601, 20310]
    # ~1700 / 2100 m
    "Selkirks":
      btl: [0, 5600]
      ntl: [5601, 6900]
      atl: [6901, 20310]
    # ~1700 / 2100 m
    "Purcells":
      btl: [0, 5600]
      ntl: [5601, 6900]
      atl: [6901, 20310]
    # ~1500 / 2000 m
    "North Rockies":
      btl: [0, 4900]
      ntl: [4901, 6600]
      atl: [6601, 20310]
    # ~2000 / 2300 m
    "Central Rockies":
      btl: [0, 6600]
      ntl: [6601, 7500]
      atl: [7501, 20310]
    # ~1900 / 2200 m
    "South Rockies":
      btl: [0, 6200]
      ntl: [6201, 7200]
      atl: [7201, 20310]
    # ~800 / 1000 m (Chic-Chocs)
    "East Coast":
      btl: [0, 2600]
      ntl: [2601, 3300]
      atl: [3301, 20310]
    # Newfoundland subregions sit well below the Chic-Chocs: ~400 / 600 m
    "Corner Brook":
      btl: [0, 1300]
      ntl: [1301, 2000]
      atl: [2001, 20310]
    "Gros Morne":
      btl: [0, 1300]
      ntl: [1301, 2000]
      atl: [2001, 20310]
    "Northern Peninsula":
      btl: [0, 1300]
      ntl: [1301, 2000]
      atl: [2001, 20310]
