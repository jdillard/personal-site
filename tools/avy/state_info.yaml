# Elevation bands (feet) per state, keyed by avalanche.org zone id; key 0 is the
# state default for zones without their own entry.
#
# Optional per entry: `confidence` (medium = derived from past forecasts, low = rough
# estimate), shown on the zone's page as a generic note; say why in a comment. Omit it
# for bands the center publishes (high). Zones on a US state default are shown as low.
- abbr: "AK"
  name: "Alaska"
  elevations:
    0: # default
      btl: [0, 4400]
      ntl: [4401, 6100]
      atl: [6101, 20310]
    # CAAC: ESTIMATED, NOT PUBLISHED. CAAC publishes no numeric bands and its archive has
    # no band-labelled elevations; from general treeline mentions: on Mt Roberts you "reach
    # the tree line" at the Mountain House (1,760-1,800 ft) and true alpine starts ~300 ft
    # higher. Applied to Douglas Island too (same latitude and maritime climate).
    # https://api.avalanche.org/v2/public/avalanche-center/CAAC
    # https://alaska.org/guide/mount-roberts-tramway-points
    # https://www.alaska.org/detail/mount-roberts-trail
    2164: # juneau
      confidence: low
      btl: [0, 1500]
      ntl: [1501, 2200]
      atl: [2201, 20310]
    2165: # douglas island
      confidence: low
      btl: [0, 1500]
      ntl: [1501, 2200]
      atl: [2201, 20310]
