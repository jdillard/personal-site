  elevations:
    # TODO: unsourced; BAC publishes no numeric bands (widget: Below/Near/Above Treeline)
    # and its forecast archive has too few band-labelled elevations to derive them, so
    # this zone falls back to the default below
    # 3004: {} # bridgeport TODO: fill in
    0: # default
      btl: [0, 6200]
      ntl: [6201, 8700]
      atl: [8701, 20310]
    # SAC: DERIVED, NOT PUBLISHED. SAC publishes no numeric bands; derived from the
    # elevations SAC forecasters give with a band label in 2023-24 to 2025-26 forecasts
    # (mostly photo captions, e.g. "NNE aspect NTL terrain at 9,080'"), 28 observations:
    # BTL 7000-9100' (median 8070), NTL 7600-9180' (median 8500), ATL 8100-9600'.
    # Bands overlap (terrain-defined; zone spans north Tahoe to Carson Pass), so NTL is
    # roughly the middle 80% of NTL observations.
    # https://api.avalanche.org/v2/public/products?avalanche_center_id=SAC
    2458: # central sierra nevada
      confidence: medium
      btl: [0, 7800]
      ntl: [7801, 9200]
      atl: [9201, 20310]
    # ESAC: DERIVED, NOT PUBLISHED. ESAC says bands are "not an exact elevation" and
    # publishes no numbers; derived from the elevations ESAC forecasters give with a band
    # label in 2023-24 to 2025-26 forecasts, 59 observations: BTL 8200-9900' (median 9200),
    # NTL 8800-10500' (middle 80%, median 9800), ATL mostly 10300-12800' (median 11100).
    # Boundaries are roughly midway between neighbouring band medians.
    # https://www.esavalanche.org/avalanche-forecast-tutorial/
    # https://api.avalanche.org/v2/public/products?avalanche_center_id=ESAC
    128: # eastside region
      confidence: medium
      btl: [0, 9500]
      ntl: [9501, 10500]
      atl: [10501, 20310]
    # MSAC: DERIVED, NOT PUBLISHED. MSAC publishes no numeric bands (widget: Below/Near/
    # Above Treeline); derived from the elevations MSAC forecasters give with a band label
    # in 2023-24 to 2025-26 forecasts, ~12 observations (excluding "Shasta Alpine Hut",
    # a place name): BTL 7000-8000', NTL 8000-8500', ATL 8900'+ (e.g. "above treeline at
    # 9,200"). Few observations, so boundaries are rough.
    # https://api.avalanche.org/v2/public/products?avalanche_center_id=MSAC
    3044: # mount shasta
      confidence: medium
      btl: [0, 7600]
      ntl: [7601, 8700]
      atl: [8701, 20310]
  active: true

- abbr: "CO"
  name: "Colorado"
  elevations:
    # CAIC publishes no numeric bands (forecast widget and site only say BTL/NTL/ATL).
    # CAIC merges many subzones into each forecast and regroups them, so like Canada,
    # bands are keyed by range name (the subzones' `forecast_zone[].name` in the CAIC
    # report). A zone uses the bands more than half of its subzones map to, else the
    # default. Zone id keys (ints) still win over ranges.
    #
    # DERIVED, NOT PUBLISHED: rough treeline by range from general knowledge, rounded to
    # 100 ft. Treeline rises north to south, ~11,000' in the Park Range to ~12,000' in
    # the San Juans. NTL is ~500' below to ~500' above treeline.
    # Spot-checked against the 2023-24 to 2025-26 forecast archives
    # (https://api.avalanche.org/v2/public/products?avalanche_center_id=CAIC&date_start=..&date_end=..,
    # every 3 days, 1617 forecasts); CAIC rarely gives numbers: 13 unique mentions, only one
    # tied to treeline ("near and above treeline, generally above 10,000 feet", Flat Tops /
    # Grand Mesa, 2026-03-04). The rest loosely agree: wind slabs "just below ridgelines"
    # at 11,000-12,500' in the Elks and Sawatch, "upper elevations above 10,500'" on Grand Mesa.
    # Not enough to raise confidence.
    0: # default
      btl: [0, 9500]
      ntl: [9501, 11500]
      atl: [11501, 20310]
    # northern ranges, treeline ~10,800'
    "Park Range": &co_north
      confidence: low
      btl: [0, 10300]
      ntl: [10301, 11300]
      atl: [11301, 20310]
    "Rabbit Ears Mountains": *co_north
    "Elkhead Mountains": *co_north
    "Medicine Bow Mountains": *co_north
    "Never Summer Mountains": *co_north
    "Flat Top Mountains": *co_north
    # central ranges, treeline ~11,300'
    "Front Range": &co_central
      confidence: low
      btl: [0, 10800]
      ntl: [10801, 11800]
      atl: [11801, 20310]
    "Pikes Peak Massif": *co_central
    "Gore Range": *co_central
    "Ten Mile Range": *co_central
    "Mosquito Range": *co_central
    "Sawatch Mountains": *co_central
    "Red Table and Hardscrabble": *co_central
    "Elk Mountains": *co_central
    "West Elk Mountains": *co_central
    # southern ranges, treeline ~11,700'
    "Northern San Juan Mountains": &co_south
      confidence: low
      btl: [0, 11200]
      ntl: [11201, 12200]
      atl: [12201, 20310]
    "Southern San Juan Mountains": *co_south
    "La Plata Mountains": *co_south
    "Rico Mountains": *co_south
    "La Garita Mountains": *co_south
    "Cochetopa Hills": *co_south
    "Sangre de Cristo Mountains": *co_south
    # forested mesa tops, ~10,000-11,300'; little true alpine
    "Grand Mesa": &co_mesa
      confidence: low
      btl: [0, 10000]
      ntl: [10001, 10800]
      atl: [10801, 20310]
    "Battlement Mesa": *co_mesa
  active: true

