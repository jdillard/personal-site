      btl: [0, 5600]
      ntl: [5601, 6900]
      atl: [6901, 20310]
    # ~1500 / 2000 m
    "North Rockies":
      confidence: medium
      btl: [0, 4900]
      ntl: [4901, 6600]
      atl: [6601, 20310]
    # ~2000 / 2300 m
    "Central Rockies":
      confidence: medium
      btl: [0, 6600]
      ntl: [6601, 7500]
