name: Build Avalanche Reports
on:
  # Run at 06:33 and 18:33 PT daily
  schedule:
    - cron: '03 02,14 * * *'
    - cron: '33 01,14 * * *'
  # (optional) Run workflow manually
  workflow_dispatch:
jobs: 
  avalanche:
    name: Build Avalanche data
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Check for Avalanche Canada subregion updates
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pinned=$(cat tools/avy/data/canadian_subregions.commit)
        latest=$(gh api repos/avalanche-canada/forecast-polygons/commits/main --jq .sha)
        if [ "$pinned" != "$latest" ]; then
          echo "::warning title=Canada subregions changed upstream::avalanche-canada/forecast-polygons main is at ${latest::7}, vendored copy is ${pinned::7}. Compare: https://github.com/avalanche-canada/forecast-polygons/compare/${pinned}...${latest}"
        fi

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Run python scripts
      run: |
        set -xe
        python -VV
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python tools/avy/download-avy-json.py
        python tools/avy/caltopo_layers.py
        python tools/avy/avalanche.py

    - name: Commit changes
      uses: EndBug/add-and-commit@v11
      with:
        default_author: github_actions
        message: "Update built avalanche data"
        add: '["source/assets/json/avalanche-reports", "source/avy", "source/assets/json/avalanche-zones"]' 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
