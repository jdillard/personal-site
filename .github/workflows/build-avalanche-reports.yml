name: Build Avalanche Reports
on:
  # Run at 06:33 and 18:33 PT daily
  schedule:
    - cron: '03 02,14 * * *'
    - cron: '33 01,14 * * *'
  # (optional) Run workflow manually
  workflow_dispatch:
jobs: 
  avalanche:
    name: Build Avalanche data
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit built data
      issues: write    # open an issue when the Canada subregions change upstream
    steps: 
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Check for Avalanche Canada subregion updates
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pinned=$(cat tools/avy/data/canadian_subregions.commit)
        latest=$(gh api repos/avalanche-canada/forecast-polygons/commits/main --jq .sha)
        if [ "$pinned" != "$latest" ]; then
          title="Avalanche Canada subregions changed upstream"
          # one open issue at a time; it stays open until the vendored copy is updated
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" --title "$title" --body "avalanche-canada/forecast-polygons \`main\` is at \`${latest::7}\`; the vendored copy is \`${pinned::7}\`.

        Changes: https://github.com/avalanche-canada/forecast-polygons/compare/${pinned}...${latest}

        To update, replace \`tools/avy/data/canadian_subregions.geojson\` with the file from that commit and write its SHA to \`tools/avy/data/canadian_subregions.commit\`."
          fi
        fi

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Run python scripts
      run: |
        set -xe
        python -VV
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python tools/avy/download-avy-json.py
        python tools/avy/caltopo_layers.py
        python tools/avy/avalanche.py

    - name: Commit changes
      uses: EndBug/add-and-commit@v11
      with:
        default_author: github_actions
        message: "Update built avalanche data"
        add: '["source/assets/json/avalanche-reports", "source/avy", "source/assets/json/avalanche-zones"]' 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
